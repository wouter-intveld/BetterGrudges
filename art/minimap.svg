<svg xmlns="http://www.w3.org/2000/svg" viewBox="96 64 320 420" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="70%"><stop offset="0" stop-color="#2a2433"/><stop offset="1" stop-color="#0d0b12"/></radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe08a"/><stop offset="0.55" stop-color="#e0b04a"/><stop offset="1" stop-color="#9a6a22"/></linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3d27a"/><stop offset="0.5" stop-color="#a8792a"/><stop offset="1" stop-color="#e8c066"/></linearGradient>
    <linearGradient id="leather" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c98a4b"/><stop offset="0.6" stop-color="#8a5328"/><stop offset="1" stop-color="#4f2c12"/></linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9a6234"/><stop offset="1" stop-color="#3d210d"/></linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9d3a4"/><stop offset="1" stop-color="#b8935a"/></linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2533f"/><stop offset="1" stop-color="#8a1a12"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.65"/></filter>
  </defs>


  <!-- The book: pages behind, then the leather cover and spine -->
  <g filter="url(#shadow)" stroke-linejoin="round">
    <rect x="150" y="100" width="242" height="320" rx="14" fill="url(#paper)" stroke="#4a3216" stroke-width="6"/>
    <path d="M330 404 L330 470 L352 450 L374 470 L374 404 Z" fill="url(#ribbon)" stroke="#4a0d08" stroke-width="5"/>
    <rect x="118" y="84" width="256" height="324" rx="16" fill="url(#leather)" stroke="#2e1a0a" stroke-width="6"/>
    <rect x="118" y="84" width="40" height="324" rx="14" fill="url(#spine)" stroke="#2e1a0a" stroke-width="6"/>
    <path d="M374 84 L374 132 L326 84 Z" fill="url(#gold)" stroke="#5a3d12" stroke-width="5"/>
    <path d="M374 408 L374 360 L326 408 Z" fill="url(#gold)" stroke="#5a3d12" stroke-width="5"/>
  </g>

  <!-- Gold plaque with a tally of grudges -->
  <g filter="url(#shadow)">
    <rect x="182" y="176" width="164" height="132" rx="18" fill="url(#gold)" stroke="#5a3d12" stroke-width="6"/>
  </g>
  <g stroke="#1c140b" stroke-width="13" stroke-linecap="round">
    <line x1="214" y1="206" x2="214" y2="278"/>
    <line x1="246" y1="206" x2="246" y2="278"/>
    <line x1="278" y1="206" x2="278" y2="278"/>
    <line x1="310" y1="206" x2="310" y2="278"/>
    <line x1="198" y1="268" x2="328" y2="214"/>
  </g>
</svg>
